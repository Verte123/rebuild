<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rebuild</title>
<meta name="description" content="Gym session builder and training log">
<meta name="theme-color" content="#EDEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rebuild">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face { font-family: "Barlow Condensed"; font-weight: 500; font-display: swap; src: url(fonts/bc-500.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(fonts/bc-600.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url(fonts/bc-700.woff2) format("woff2"); }

:root {
  color-scheme: light;
  --page: #EDEFF1; --surface: #FFFFFF; --raised: #F4F5F7; --sunk: #E4E7EA;
  --ink: #1B2026; --ink-2: #4B545D; --ink-3: #737C86; --line: #D7DBDF;
  --accent: #1F5FBF; --accent-ink: #FFFFFF; --accent-soft: #E1EAF8;
  --good: #11713A; --good-soft: #DDF1E4; --warn: #865700; --warn-soft: #F8EDCF; --bad: #B3261E; --bad-soft: #F8E0DE;
  --series: #2a78d6; --series-wash: rgba(42,120,214,.10); --grid: #e1e0d9; --axis: #c3c2b7; --muted: #898781;
  --heat-0: #E4E7EA; --heat-1: #b7d3f6; --heat-2: #6da7ec; --heat-3: #2a78d6; --heat-4: #184f95;
  --p25: #D32F2F; --p20: #1F5FBF; --p15: #F2C230; --p10: #2E8B47; --p5: #F4F4F4; --p25s: #D32F2F; --p125: #AEB4BA; --sleeve: #9AA1A8;
  --num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --day-empty: #DDE1E5;
  --r-sheet: 18px; --r-ctl: 10px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #101316; --surface: #191D21; --raised: #22272C; --sunk: #0C0F11;
    --ink: #E8EBEE; --ink-2: #B2BAC2; --ink-3: #8A939C; --line: #2C3238;
    --accent: #5B95EC; --accent-ink: #0B1220; --accent-soft: #1B2A40;
    --good: #46C27A; --good-soft: #15301F; --warn: #E0B13A; --warn-soft: #33290F; --bad: #F07068; --bad-soft: #3A1715;
    --series: #3987e5; --series-wash: rgba(57,135,229,.14); --grid: #2c2c2a; --axis: #383835; --muted: #898781;
    --heat-0: #22272C; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #86b6ef;
    --p5: #E6E6E6; --sleeve: #5F666D; --day-empty: #2A3036;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #101316; --surface: #191D21; --raised: #22272C; --sunk: #0C0F11;
  --ink: #E8EBEE; --ink-2: #B2BAC2; --ink-3: #8A939C; --line: #2C3238;
  --accent: #5B95EC; --accent-ink: #0B1220; --accent-soft: #1B2A40;
  --good: #46C27A; --good-soft: #15301F; --warn: #E0B13A; --warn-soft: #33290F; --bad: #F07068; --bad-soft: #3A1715;
  --series: #3987e5; --series-wash: rgba(57,135,229,.14); --grid: #2c2c2a; --axis: #383835; --muted: #898781;
  --heat-0: #22272C; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #86b6ef;
  --p5: #E6E6E6; --sleeve: #5F666D; --day-empty: #2A3036;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 16px/1.45 var(--body);
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- frame */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--page);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid transparent;
}
.top.scrolled { border-bottom-color: var(--line); }
.brand { font-family: var(--num); font-weight: 700; font-size: 26px; letter-spacing: .01em; margin: 0; }
.top .meta { font-size: 14px; color: var(--ink-2); text-align: right; }
main { max-width: 560px; margin: 0 auto; padding: 0 16px 24px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.tabbar button {
  height: var(--tabbar); border: 0; background: none; color: var(--ink-3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px;
}
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tabbar .dot { position: absolute; margin: -22px 0 0 22px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

h2 { font-family: var(--num); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 18px 0 6px; }
h3 { font-family: var(--num); font-weight: 600; font-size: 22px; line-height: 1.1; margin: 0; }
h4 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; color: var(--ink); }
p { margin: 0 0 8px; }
.sub { color: var(--ink-2); font-size: 15px; }
.small { font-size: 13px; color: var(--ink-3); }
.panel { background: var(--surface); border-radius: var(--r-sheet); padding: 16px; margin: 12px 0; }
.rule { height: 1px; background: var(--line); margin: 14px 0; border: 0; }

/* ---------------------------------------------------------------- controls */
.btn {
  min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 15px;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); font-weight: 600; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 42px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
label.field { display: block; margin: 10px 0; }
label.field > span { display: block; font-size: 14px; color: var(--ink-2); margin-bottom: 4px; }
input[type=text], input[type=number], select, textarea {
  width: 100%; min-height: 46px; border-radius: var(--r-ctl); border: 1px solid var(--line);
  background: var(--raised); padding: 0 12px; font-size: 16px;
}
textarea { padding: 10px 12px; min-height: 120px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.check .grow { font-size: 15px; }

/* ---------------------------------------------------------------- minutes picker */
.minutes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0 4px; }
.minutes button {
  border: 0; background: transparent; padding: 6px 0 4px; border-radius: 12px; color: var(--ink-3);
  font-family: var(--num); font-weight: 600; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums;
}
.minutes button[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); }
.minutes-label { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-3); }
.stack-gap > * + * { margin-top: 14px; }
.lbl { font-size: 14px; color: var(--ink-2); margin: 0 0 6px; }

/* ---------------------------------------------------------------- recovery */
.recov { display: grid; grid-template-columns: 88px 1fr auto; gap: 6px 10px; align-items: center; font-size: 14px; }
.recov .bar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.recov .bar i { display: block; height: 100%; background: var(--ink-3); border-radius: 4px; }
.recov .bar i.ready { background: var(--accent); }
.recov .when { color: var(--ink-3); text-align: right; min-width: 92px; font-size: 13px; }

/* ---------------------------------------------------------------- session */
.sess-head { margin: 14px 0 4px; }
.sess-head .big { font-family: var(--num); font-weight: 700; font-size: 38px; line-height: 1; }
.banner { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 10px 0; background: var(--accent-soft); color: var(--ink); }
.banner.warn { background: var(--warn-soft); }
.ex { background: var(--surface); border-radius: var(--r-sheet); padding: 14px 14px 10px; margin: 12px 0; position: relative; }
.ex.superset-a { border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; margin-bottom: 3px; }
.ex.superset-b { border-top-left-radius: 4px; border-top-right-radius: 4px; margin-top: 0; }
.ex .pair { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
.ex-head { display: flex; gap: 8px; align-items: flex-start; }
.ex-head h3 { flex: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--raised); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.eqname { font-size: 13px; color: var(--ink-3); margin: 2px 0 8px; }
.target { font-size: 15px; margin: 0 0 4px; }
.target b { font-family: var(--num); font-weight: 700; font-size: 21px; }
.why { font-size: 14px; color: var(--ink-2); margin: 0 0 8px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 7px; background: var(--warn-soft); color: var(--warn); margin-right: 6px; vertical-align: 2px; }
.plates { margin: 6px 0 10px; display: flex; align-items: center; gap: 10px; }
.plates svg { flex: none; }
.plates .txt { font-size: 14px; color: var(--ink-2); }
.plates .txt b { font-family: var(--num); font-size: 18px; color: var(--ink); }

.sets { margin: 4px 0 6px; }
.set { display: grid; grid-template-columns: 20px 1.3fr 1fr 48px; gap: 6px; align-items: center; padding: 5px 0; }
.set .n { font-family: var(--num); font-size: 18px; color: var(--ink-3); text-align: center; }
.stepper { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; align-items: center; background: var(--raised); border-radius: 12px; height: 50px; }
.stepper button { border: 0; background: none; height: 100%; font-size: 22px; color: var(--ink-2); }
.stepper input {
  border: 0; background: transparent; text-align: center; min-height: 0; height: 100%; width: 100%; padding: 0;
  font-family: var(--num); font-weight: 600; font-size: 25px; font-variant-numeric: tabular-nums;
}
.stepper input::placeholder { color: var(--ink-3); opacity: .7; }
.stepper .unit { display: none; }
.set-head { display: grid; grid-template-columns: 20px 1.3fr 1fr 48px; gap: 6px; font-size: 12px; color: var(--ink-3); text-align: center; }
.tick { width: 48px; height: 50px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-3); }
.tick svg { width: 26px; height: 26px; }
.set.done .stepper { background: var(--good-soft); }
.set.done .tick { background: var(--good); border-color: var(--good); color: #fff; }
.effort { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-size: 14px; color: var(--ink-2); flex-wrap: wrap; }
.effort .seg { flex: 1; min-width: 220px; }
.last { font-size: 13px; color: var(--ink-3); margin: 6px 0 0; }
.ex-foot { display: flex; justify-content: space-between; align-items: center; }

.restbar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom)); z-index: 25;
  background: var(--ink); color: var(--page); padding: 10px 16px; display: none; align-items: center; gap: 12px;
}
.restbar.on { display: flex; }
body.resting { padding-bottom: calc(var(--tabbar) + 76px + env(safe-area-inset-bottom)); }
.restbar .t { font-family: var(--num); font-weight: 700; font-size: 34px; line-height: 1; min-width: 86px; font-variant-numeric: tabular-nums; }
.restbar .lab { flex: 1; font-size: 14px; opacity: .85; }
.restbar button { min-height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: inherit; padding: 0 12px; font-weight: 600; }
:root[data-theme="dark"] .restbar button, .restbar button { border-color: color-mix(in srgb, var(--page) 35%, transparent); }
.restbar .prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); }
.restbar.done { background: var(--good); color: #fff; }

/* ---------------------------------------------------------------- sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; display: none; }
.scrim.on { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0; max-height: 86vh; overflow: auto;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%);
  transition: transform .22s ease, visibility 0s linear .22s; visibility: hidden;
  max-width: 600px; margin: 0 auto;
}
.sheet.on { transform: none; visibility: visible; transition: transform .22s ease; }
.sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.opt { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 2px; }
.opt b { display: block; font-weight: 600; }
.opt span { font-size: 13px; color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
@media (max-width: 359px) { .stepper { grid-template-columns: 26px minmax(0, 1fr) 26px; } .stepper input { font-size: 21px; } .set, .set-head { gap: 4px; } }

/* ---------------------------------------------------------------- summary & history */
.statline { display: flex; gap: 22px; flex-wrap: wrap; margin: 6px 0 4px; }
.statline div { min-width: 70px; }
.statline b { display: block; font-family: var(--num); font-weight: 700; font-size: 34px; line-height: 1; }
.statline span { font-size: 13px; color: var(--ink-3); }
.outcome { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.outcome:last-child { border-bottom: 0; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; align-self: start; }
.badge.up { background: var(--good-soft); color: var(--good); }
.badge.hold { background: var(--accent-soft); color: var(--accent); }
.badge.miss { background: var(--warn-soft); color: var(--warn); }
.badge.cal, .badge.deload { background: var(--sunk); color: var(--ink-2); }
.hist { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 14px; padding: 12px; margin: 8px 0; }
.hist .d { font-family: var(--num); text-align: center; line-height: 1; }
.hist .d b { display: block; font-size: 28px; font-weight: 700; }
.hist .d span { font-size: 13px; color: var(--ink-3); }
.month { font-size: 14px; color: var(--ink-3); margin: 18px 0 0; }
.empty { text-align: left; padding: 22px 16px; background: var(--surface); border-radius: var(--r-sheet); margin: 14px 0; }

/* ---------------------------------------------------------------- charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--page); font-size: 13px;
  padding: 6px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); display: none;
}
.chart .tip b { font-family: var(--num); font-size: 17px; }
.linkish { background: none; border: 0; color: var(--accent); padding: 6px 0; font-size: 14px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
table.data th, table.data td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.pr { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.pr:last-child { border-bottom: 0; }
.pr .num { font-size: 19px; font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 14px); transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 14px; border-radius: 12px; font-size: 14px; z-index: 50; display: none; max-width: 90vw; }
.toast.on { display: block; }
details.group { background: var(--surface); border-radius: 14px; margin: 8px 0; padding: 0 14px; }
details.group summary { list-style: none; min-height: 52px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
details.group summary::-webkit-details-marker { display: none; }
details.group summary .small { margin-left: auto; font-weight: 400; }
details.group[open] summary { border-bottom: 1px solid var(--line); }
.steps { padding-left: 20px; margin: 6px 0; }
.steps li { margin: 6px 0; }

/* ---------------------------------------------------------------- dashboard */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0 14px; }
.week .day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-3); }
.week .day i { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 10px; background: var(--day-empty); display: grid; place-items: center; color: #fff; }
.week .day i svg { width: 18px; height: 18px; }
.week .day.done i { background: var(--accent); }
.week .day.today { color: var(--ink); font-weight: 600; }
.week .day.today i { box-shadow: inset 0 0 0 2px var(--ink); }
.week .day.today.done i { box-shadow: none; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border-radius: 14px; padding: 9px 12px; min-width: 0; }
.tile span { display: block; font-size: 13px; color: var(--ink-3); }
.tile b { display: block; font-family: var(--num); font-weight: 700; font-size: 30px; line-height: 1.05; }
.tile b small { font-size: 16px; font-weight: 600; color: var(--ink-2); }
.tile em { display: block; font-style: normal; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.tile em.up { color: var(--good); } .tile em.down { color: var(--warn); }
.next { background: var(--surface); border-radius: var(--r-sheet); padding: 16px; margin: 14px 0; border-top: 6px solid var(--accent); }
.next-title { font-size: 28px; font-weight: 700; margin: 0; }
.next .minutes { margin-top: 4px; }
.next .minutes button { font-size: 34px; }
.plan { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); }
.plan li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.plan .pt { font-family: var(--num); font-size: 17px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.focusbox summary { list-style: none; color: var(--accent); font-size: 15px; min-height: 40px; display: flex; align-items: center; cursor: pointer; }
.focusbox summary::-webkit-details-marker { display: none; }
.focusbox .chips { margin-bottom: 10px; }
.btn.big { min-height: 56px; font-size: 18px; margin-top: 4px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.duo .panel { margin: 0; }
.panel.tight { padding: 12px 14px; }
.panel.tight .lbl { margin-bottom: 4px; font-size: 13px; color: var(--ink-3); }
.strong { font-weight: 600; margin: 0 0 2px; line-height: 1.25; }
.back { background: none; border: 0; color: var(--accent); font-size: 16px; padding: 12px 0 0; }

/* ---------------------------------------------------------------- how-to and swap */
.pills { display: flex; gap: 8px; margin: 2px 0 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); font-size: 14px; font-weight: 600; }
.pill svg, .btn svg { width: 18px; height: 18px; flex: none; }
.alt { display: flex; gap: 8px; align-items: stretch; border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; overflow: hidden; }
.alt-main { flex: 1; text-align: left; border: 0; background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.alt-main b { font-family: var(--num); font-size: 20px; font-weight: 600; }
.alt-main span { font-size: 14px; color: var(--ink-2); }
.alt-how { width: 52px; border: 0; border-left: 1px solid var(--line); background: var(--raised); color: var(--accent); display: grid; place-items: center; }
.alt-how svg { width: 22px; height: 22px; }
.cues { padding-left: 22px; margin: 12px 0 8px; }
.cues li { margin: 8px 0; line-height: 1.45; }
a.btn { text-decoration: none; color: var(--ink); }
.clip { display: flex; gap: 12px; align-items: center; text-decoration: none; color: var(--ink); background: var(--raised); border-radius: 14px; padding: 12px; margin-top: 14px; }
.clip-play { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.clip-play svg { width: 22px; height: 22px; margin-left: 3px; }
.clip b { display: block; font-weight: 600; line-height: 1.3; }
.clip span span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }


/* ---------------------------------------------------------------- cloud */
.cloudline { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; margin: 14px 2px 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ink-3); }
.dot.ok { background: var(--good); } .dot.wait { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.busy { background: var(--accent); }
#cloud-cfg { min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
#cloud-msg { color: var(--bad); min-height: 1em; margin: 4px 0 10px; }
</style>
</head>
<body>
<header class="top" id="top">
  <h1 class="brand">Rebuild</h1>
  <div class="meta" id="topmeta"></div>
</header>
<main id="view" aria-live="polite"></main>

<div class="restbar" id="restbar" role="timer" aria-live="off">
  <div class="prog" id="restprog"></div>
  <div class="t" id="resttime">0:00</div>
  <div class="lab" id="restlab">Rest</div>
  <button type="button" data-action="rest-add">+30 s</button>
  <button type="button" data-action="rest-skip">Skip</button>
</div>

<nav class="tabbar" aria-label="Sections">
  <button type="button" data-tab="train" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button type="button" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
  <button type="button" data-tab="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 4 3 6-7"/></svg>Progress</button>
  <button type="button" data-tab="setup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Options"><div class="grip"></div><div id="sheetbody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="engine.js"></script>
<script src="guides.js"></script>
<script src="firebase.js"></script>
<script src="cloud-config.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
